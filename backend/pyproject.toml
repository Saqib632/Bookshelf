[project]
name = "book-rag-api"
version = "0.1.0"
description = "Grounded chat with books using RAG and CRAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "motor>=3.6,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "google-auth>=2.38,<3",
  "httpx>=0.28,<1",
  "dramatiq[redis]>=1.17,<2",
  "qdrant-client>=1.12,<2",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
